# Active l'enregistrement du service dans Eureka
spring.cloud.discovery.enabled=true
# Le service s'enregistre dans Eureka avec son adresse IP (au lieu du nom de la machine)
eureka.instance.prefer-ip-address=true
# Active la récupération de la configuration depuis le config-service
spring.cloud.config.enabled=true

# Configuration de la documentation Swagger (OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Expose tous les endpoints Actuator (health, info, env, ...)
management.endpoints.web.exposure.include=*

# Adresse du serveur Eureka (variable d'environnement si elle existe, sinon localhost)
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
