# Base de données H2 en mémoire pour le service des clients
spring.datasource.url=jdbc:h2:mem:customer-db
# Active la console web H2 pour consulter la base
spring.h2.console.enabled=true

# Valeurs par défaut personnalisées (lues plus tard dans customer-service)
customer.service.default.location=Casablanca
customer.service.default.currency=MAD
customer.service.default.language=Arabic
